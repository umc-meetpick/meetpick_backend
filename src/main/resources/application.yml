spring:
  datasource:
    url: jdbc:h2:mem:testdb  # 인메모리 H2 데이터베이스 사용
    driver-class-name: org.h2.Driver
    username: sa  # 기본 사용자
    password:  # 기본적으로 비밀번호 없음
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # 스키마 자동 업데이트
  h2:
    console:
      enabled: true  # H2 웹 콘솔 활성화
      path: /h2-console  # H2 콘솔 접속 경로 설정
      settings:
        web-allow-others: true  # 원격 접속 허용

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 014f4cb37c727f56794afaf696a6b8d3
            client-secret: q9krpFKTlBAJ63D5iMpeN3Pdqzz1eb8x
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            scope: profile_nickname
            client-name: Kakao
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jwt:
    secret: MBmyRKy5ewzjVqQ5mDiXkeK4ECmByFUax6I0iWgiFzs=

front:
  redirect-url: "http://localhost:5173"